# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "38627796d0f7702950539612bd57fb60"
name = "Communication Apps"
application_url = "https://communication-tool.on-forge.com/shopify/login"
embedded = false

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customer_events,read_checkout_and_accounts_configurations,write_checkout_and_accounts_configurations,write_checkouts,read_checkouts,read_customers,write_customers,read_files,write_files,read_inventory,read_locales,write_locales,read_locations,read_markets,write_markets,read_markets_home,read_orders,write_orders,read_products,write_products,read_publications,write_publications,customer_write_customers,customer_read_customers,unauthenticated_read_content"
optional_scopes = [ "read_content", "write_content" ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://communication-tool.on-forge.com/shopify/login/callback"
]

[app_proxy]
# Storefront: /apps/communication  ->  https://communication-tool.on-forge.com/shopify/proxy
# Generic RPC endpoint: POST JSON body { "method": "cancel_order", ... }
url = "https://communication-tool.on-forge.com/shopify/proxy"
subpath = "communication"
prefix = "apps"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = [ "orders/updated" ]
uri = "https://communication-tool.on-forge.com/shopify/webhooks/orders/updated"
